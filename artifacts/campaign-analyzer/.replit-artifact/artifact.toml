kind = "web"
previewPath = "/"
title = "Ad Campaign Performance Analyzer"
description = "CSV-powered marketing dashboard comparing spend, clicks, conversions and ROI across Facebook, Instagram, Pinterest and Twitter, with shared filters and four analytical views."
version = "1.0.0"
id = "artifacts/campaign-analyzer"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19033

[services.development]
run = "streamlit run app.py --server.address 0.0.0.0 --server.port $PORT --server.headless true"

[services.production.build]
args = ["uv", "sync", "--locked"]

[services.production.run]
args = ["uv", "run", "--locked", "streamlit", "run", "artifacts/campaign-analyzer/app.py", "--server.address", "0.0.0.0", "--server.port", "19033", "--server.headless", "true"]

[services.production.health.startup]
path = "/"

[services.env]
PORT = "19033"
